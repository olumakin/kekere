database:
  url: "sqlite:///skynet_championship.db"
  echo: false

data:
  raw_dir: "data/raw"
  models_dir: "data/models"
  football_data_base_url: "https://www.football-data.co.uk/mmz4281"
  division_code: "E1" # EFL Championship
  burn_in_seasons:
    - "1920"
    - "2021"
  evaluation_seasons:
    - "2122"
    - "2223"
    - "2324"
    - "2425"
    - "2526"

strategy:
  draw_prob_threshold: 0.31 # Min predicted draw probability (31%)
  min_edge: 0.03 # Min model edge over vig-adjusted market (3.0%)
  kelly_fraction: 0.25 # Quarter Kelly
  max_stake_pct: 0.02 # 2% max per match
  daily_exposure_limit_pct: 0.06 # 6% max daily exposure
  circuit_breaker_loss_streak: 5 # Reduce stake after 5 consecutive losses

gate:
  min_bets: 150
  min_roi: 0.0
  min_clv: 0.0
  cox_slope_min: 0.8
  cox_slope_max: 1.2
  cox_intercept_min: -0.05
  cox_intercept_max: 0.05

dixon_coles:
  xi: 0.0019 # Time decay parameter (approx half-life ~ 1 year)
  max_goals: 10
